[capture]
fps = 12
display_fps = 30
window_title = "MapleStory"
data_dir = "data"

[debugger]
port = 8765

[perception]
spawn_source = "osms-classic"
spawn_revision = "17dc5dc14cc1d1f05152362c1bbcffa068e8dc81"
confidence = 0.85
player_margin = 0.04
max_candidates = 24
# Name tag text match; teach it with Add name tag.
nametag_confidence = 0.85
# When the player is briefly hidden (grass, another player walking through),
# weaker evidence is accepted only near the last tracked position. Each frame with
# evidence extends tracking; it ends after track_seconds without evidence or
# track_max_seconds since the last confirmed frame. nametag_partial is the score
# for a partly covered tag there.
nametag_partial = 0.6  # random scenery near the player scores up to ~0.46
track_seconds = 1.0
track_max_seconds = 5.0
# Search only this many pixels around the tracked player once found; the whole frame is
# searched when the player is lost. 0 for either value searches the whole frame.
roi_width = 700
roi_height = 420

[agent]
platform_tolerance = 18
# The character is currently a Beginner with a club: a custom 0-65 px band attacks
# before contact (about 35-40 px), inside the shortest 1H blunt swing (69 px;
# docs/warrior-ranges.md). Apply "custom" under Bot > Weapon range to use it.
range_profile = "custom"
# Named presets set both limits. Use "custom" to use the numeric values below.
# Bot > Weapon range also saves an explicit choice without restarting.
attack_range = 65
# The classic_bow preset uses 120-250 px, shared by basic AND Arrow Blow (no Eye bonus).
# Native capture-pixel centre distances; margins, not exact game hitbox limits.
# Sources and v83/Classic mismatch reporting: docs/bowman-range-research.md.
# Inside the minimum the bot stops; it never retreats blindly toward a ledge.
attack_min_range = 0
movement_seconds = 0.12
attack_seconds = 0.06
verify_seconds = 0.45
max_attack_attempts = 6
# Skill attack while MP is at or above high; basic attack below low or when MP is unreadable.
use_skill = false
skill_low_mp = 20.0
skill_high_mp = 40.0
# Platform rotation: after this many seconds without a same-platform target, move on.
clear_seconds = 4.0

[input]
left = "left"
right = "right"
attack = "ctrl"
jump = "alt"
up = "up"
down = "down"
hp_potion = "insert"
mp_potion = "delete"
pet_food = "f"
skill = "ctrl"
max_action_seconds = 0.25
vertical_lease_seconds = 1.0
vertical_lease_max_seconds = 8.0
emergency_key = "f8"

[probe]
potion_effect_seconds = 2.0
potion_min_gain_percent = 1.0
potion_full_percent = 95.0

# Software-input realism only. No input-origin concealment or external hardware.
[timing]
enabled = true
hold_variation = 0.20
min_hold_seconds = 0.015
reaction_min_seconds = 0.025
reaction_max_seconds = 0.085
rest_min_seconds = 0.020
rest_max_seconds = 0.065
key_stagger_seconds = 0.012
offset_variation_seconds = 0.006
# Set seed = 123 only when reproducible timing is useful for tests.

# Decisions are logged for every dry run / armed run. Frames are kept in memory
# and saved only around stops, uncertain player detection and "Save last clip".
# Nothing under data/recordings is deleted automatically (docs/recording-preservation.md);
# max_total_mb and max_age_days are kept for compatibility and no longer prune anything.
[recording]
auto = true
buffer_seconds = 10
keyframe_seconds = 1.0  # 0 disables periodic context frames
post_seconds = 2.0
max_queue_frames = 240
max_total_mb = 2048
max_age_days = 7
