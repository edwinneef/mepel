[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maple-external-bot"
version = "0.1.0"
description = "Screenshot-only external MapleStory agent and calibration debugger"
requires-python = ">=3.12"
dependencies = ["mss>=10,<11", "numpy>=2,<3", "opencv-python-headless>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
maplebot = "maplebot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maplebot = ["static/*.html", "static/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
